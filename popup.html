<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <title>Sourcing Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500&display=swap">
<style>
:root{
  --primary:#0056b3;--primary2:#003f87;
  --bg:#f7f9ff;--panel:#ffffff;--panel2:#f1f4f9;
  --border:#c2c6d4;--text:#181c20;--muted:#424752;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 'Inter',system-ui,sans-serif;width:320px;background:var(--bg);color:var(--text);padding:0}

/* ── Header ─────────────────────────────── */
.hd{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--border);background:var(--panel)}
.hd svg{flex-shrink:0}
.hd-title{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:14px;color:var(--primary)}

/* ── Stats bar ───────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);background:var(--panel)}
.stat{display:flex;flex-direction:column;align-items:center;padding:8px 6px;border-right:1px solid var(--border)}
.stat:last-child{border-right:0}
.stat-v{font-family:'IBM Plex Sans',sans-serif;font-size:18px;font-weight:600;color:var(--text);line-height:1}
.stat-l{font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* ── Sections ────────────────────────────── */
.body{padding:12px 14px 14px}
.sec-title{font-family:'IBM Plex Sans',sans-serif;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.sec-title:first-child{margin-top:0}

/* ── Controls ────────────────────────────── */
.inline-row{display:flex;gap:6px;margin-bottom:6px}
.inline-row input{flex:1;padding:6px 8px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:4px;font:12px/1 'Inter',system-ui,sans-serif}
.inline-row input:focus{outline:none;border-color:var(--primary)}
select{width:100%;padding:6px 8px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:4px;font:13px/1.4 'Inter',system-ui,sans-serif;margin-bottom:6px}
select:focus{outline:none;border-color:var(--primary)}
.toggle-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px}
.toggle-row input{width:auto;accent-color:var(--primary)}

/* ── Buttons ─────────────────────────────── */
.btn{width:100%;padding:8px 12px;border-radius:4px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:0;margin-bottom:5px;text-align:left;transition:background .13s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary2)}
.btn-ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--panel2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:11px;color:var(--muted);line-height:1.4;margin-bottom:8px}

/* ── Status ──────────────────────────────── */
#status{font-size:11px;color:var(--muted);min-height:14px;margin-top:4px;word-break:break-word}

/* ── Divider ─────────────────────────────── */
.div{height:1px;background:var(--border);margin:10px 0}
</style>
</head>
<body>
  <!-- Header -->
  <div class="hd">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="1" y="5" width="18" height="11" rx="2" stroke="#0056b3" stroke-width="1.5" fill="none"/>
      <rect x="6" y="2" width="8" height="4" rx="1" stroke="#0056b3" stroke-width="1.5" fill="none"/>
      <line x1="1" y1="10" x2="19" y2="10" stroke="#0056b3" stroke-width="1.5"/>
      <rect x="8.5" y="8.5" width="3" height="3" rx="0.5" fill="#0056b3"/>
    </svg>
    <span class="hd-title">Sourcing Agent</span>
  </div>

  <!-- Stats bar -->
  <div class="stats">
    <div class="stat"><span class="stat-v" id="q">0</span><span class="stat-l">Queued</span></div>
    <div class="stat"><span class="stat-v" id="r">0</span><span class="stat-l">Running</span></div>
    <div class="stat"><span class="stat-v" id="c">0</span><span class="stat-l">Candidates</span></div>
  </div>

  <div class="body">
    <!-- LinkedIn agent -->
    <div class="sec-title">LinkedIn Agent (auto)</div>
    <select id="role"></select>
    <div class="inline-row">
      <input id="pages" type="number" min="1" max="20" value="10" title="Max pages to scan" placeholder="Pages" />
      <input id="max"   type="number" min="1" max="200" value="20" title="Target shortlisted (score ≥ 80) for Naukri/Instahyre; max profiles for LinkedIn" placeholder="Target" />
    </div>
    <label class="toggle-row">
      <input id="deep" type="checkbox" checked /> Open each profile for deep score
    </label>
    <button id="agent" class="btn btn-primary">&#9654; Run agent on this LinkedIn tab</button>

    <div class="div"></div>

    <!-- Portal agents -->
    <div class="sec-title">Other portals</div>
    <button id="agentNaukri" class="btn btn-ghost">&#9654; Run agent on this Naukri Resdex tab</button>
    <button id="agentInsta"  class="btn btn-ghost">&#9654; Run agent on this Instahyre tab</button>
    <button id="capture"     class="btn btn-ghost">Quick scrape (current page only)</button>
    <p class="hint">Open the portal's search results in a tab and click Run. Same boolean&nbsp;+&nbsp;scoring is applied across portals.</p>
    <div id="status"></div>

    <div class="div"></div>

    <!-- Dashboard -->
    <div class="sec-title">Dashboard</div>
    <button id="open" class="btn btn-ghost">Open dashboard</button>
    <button id="kick" class="btn btn-ghost">Run next queued job</button>
  </div>

  <script type="module" src="popup.js"></script>
</body></html>
